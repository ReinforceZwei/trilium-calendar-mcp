[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trilium-calendar-mcp"
version = "0.1.0"
description = "MCP server exposing Nextcloud-Calendar-style event tools backed by Trilium notes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ReinforceZwei" }]
keywords = ["mcp", "trilium", "calendar", "caldav", "etapi", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "mcp>=2.0,<3",
  "trilium-py>=1.3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trilium-calendar-mcp = "trilium_calendar_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trilium_calendar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a live Trilium instance (set TRILIUM_URL / TRILIUM_ETAPI_TOKEN)",
]
addopts = "-q"
