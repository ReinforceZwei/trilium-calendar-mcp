services:
  trilium-calendar-mcp:
    image: ghcr.io/reinforcezwei/trilium-calendar-mcp:latest
    container_name: trilium-calendar-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8102"
      # No host allowlist needed: binding all interfaces disables the
      # DNS-rebinding check (MCP_ALLOWED_HOSTS is only for exposing a
      # loopback-bound server under another name, e.g. through a proxy).
    ports:
      # 127.0.0.1 keeps the endpoint private to this host; expose on another
      # interface (or front it with your own proxy/auth) if the agent MCP
      # client lives elsewhere.
      - "127.0.0.1:8102:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); sys.exit(s.connect_ex(('127.0.0.1',8102)))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
